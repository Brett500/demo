<!DOCTYPE html>
<html>
    <head>
        <title>Colliding Shapes</title>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.x/dist/aframe-physics-system.min.js"></script> 

    </head>
    <body>
        <a-scene physics="gravity:-9.8">
    
            <a-sky color="lightblue"></a-sky>
          <a-entity camera look-controls
                wasd-controls
                position="0 1.6 0"
                constraint="collideConnected:true"
                static-body
            ></a-entity>
            <!-- Floor -->
            <a-plane static-body
                color="tan"
                position="0 0 0"
                width="30"
                height="30"
                rotation="-90 0 0"
            ></a-plane>
           <a-box
            dynamic-body
            position="-4 2.5 2"
            height="5"
            width="0.25"
            depth="1"
            color="blue"
            ></a-box>
            
            <a-box
            dynamic-body
            position="-4 7.5 2"
            color="yellow"
            width="4.5"
            ></a-box>
            
         
            <!-- Fixed box -->
            <a-box static-body
                position="0 2 -5"
                width="4"
                height="2"
                depth="1"
                rotation="40 0 -20"
                color="purple">
            </a-box>
            
            <!-- Freely Moving Sphere -->
            <a-sphere dynamic-body
                position="0 5 -5"
                color="red"
            ></a-sphere>
            
            <a-sphere
            dynamic-body
            position= "3 1 -3" color="orange"
    
            
            ></a-sphere>
            <a-cylinder
            dynamic-body
            position="4.5 1 2"
            ></a-cylinder>
            <a-sphere dynamic-body
            position="4.8 2 2"
            color="green"
            ></a-sphere>
            
          
    </a-scene>
  </body>
</html>
